name: Python Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "lambda_src/**"
      - ".github/workflows/python-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "lambda_src/**"
      - ".github/workflows/python-test.yml"

jobs:
  lint:
    name: ruff / black
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff black

      - name: ruff（構文チェック）
        run: ruff check lambda_src scripts

      - name: black（フォーマットチェック）
        run: black --check lambda_src scripts

  scripts-test:
    name: scripts のユニットテスト
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-cov

      - name: Run pytest
        run: pytest test_verify_stack.py -v --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: false

  lambda-test:
    name: lambda_src のユニットテスト
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_DEFAULT_REGION: ap-northeast-1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r lambda_src/requirements-dev.txt pytest-cov

      - name: Run pytest
        run: pytest lambda_src -v --cov=lambda_src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-lambda
          fail_ci_if_error: false
